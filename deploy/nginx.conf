# Set by the authenticated Server Manager proxy, never trusted from a browser.
# Deployment replaces OWNER_USERNAME with the selected owner's username.
map $http_x_aethr_user $owner_access {
    default 0;
    "OWNER_USERNAME" 1;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /health { return 200 "ok\n"; }
    location / {
        if ($owner_access = 0) { return 403; }
        try_files $uri $uri/ =404;
    }
}
